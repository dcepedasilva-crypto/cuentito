<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuento: El mundo se rompió</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <header class="header">
        <h1>El mundo se rompió</h1>
        
        <!-- Panel de Controles -->
        <div class="controls-container">
            <button id="btn-prev" class="btn" aria-label="Página anterior">◀ Anterior</button>
            <button id="btn-next" class="btn" aria-label="Página siguiente">Siguiente ▶</button>

            <span class="separator">|</span>

            <button id="btn-tts" class="btn btn-accessibility" aria-label="Lectura en voz alta">🔊 Leer en Voz Alta</button>
            <button id="btn-zoom-in" class="btn btn-accessibility" aria-label="Agrandar vista">A+</button>
            <button id="btn-zoom-out" class="btn btn-accessibility" aria-label="Achicar vista">A-</button>
            
            <span class="separator">|</span>

            <!-- Botón de Descarga -->
            <a id="btn-download" class="btn btn-download" href="./Elmundoserompi%C3%B3.pdf" download="Elmundoserompio.pdf" aria-label="Descargar cuento">📥 Descargar Cuento</a>
        </div>

        <!-- Sistema de Calificación con 5 Estrellas -->
        <div class="rating-container" aria-label="Puntuar cuento">
            <span>Puntúa este cuento:</span>
            <div class="stars" id="star-rating">
                <span data-value="1" class="star">&#9733;</span>
                <span data-value="2" class="star">&#9733;</span>
                <span data-value="3" class="star">&#9733;</span>
                <span data-value="4" class="star">&#9733;</span>
                <span data-value="5" class="star">&#9733;</span>
            </div>
            <span id="rating-message" class="rating-message"></span>
        </div>

        <div id="page-info" class="page-info">Página 0 de 0</div>
        <div id="loading">Cargando cuento...</div>
    </header>

    <main class="book-container">
        <div id="flip-book" class="flip-book"></div>
        
        <!-- Contenedor para la flor al llegar a la página final -->
        <div id="final-flower-container" class="final-flower-container" style="display: none;">
            <div class="flower">🌸</div>
            <p class="flower-text">¡Gracias por leer este cuento!</p>
            <button id="btn-restart" class="btn">Volver a leer</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
